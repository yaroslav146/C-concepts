<!doctype html>
<html lang="cs" data-theme="sepia">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#161310">
  <title>C# — studijní kniha</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f9;
      --paper: #ffffff;
      --sidebar-bg: #fafbfd;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-soft: #eef2ff;
      --code: #0f172a;
      --code-header: #1e293b;
      --green: #10b981;
      --surface-soft: #f1f5f9;
      --surface-hover: #f1f5f9;
      --article-ink: #334155;
      --strong-ink: #0f172a;
      --subtle-ink: #475569;
      --inline-code-bg: #f1f5f9;
      --quote-bg: #f8fafc;
      --quote-ink: #475569;
      --quote-line: #6366f1;
      --button-bg: #ffffff;
      --search-bg: #ffffff;
      --paper-shadow: 0 1px 3px rgba(15, 23, 42, 0.03), 0 12px 32px -4px rgba(15, 23, 42, 0.05);
      --success-soft: #ecfdf5;
      --success-border: #a7f3d0;
      --success-ink: #059669;
      --success-active: #d1fae5;
      --glass: rgba(244, 246, 249, 0.82);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0b0e14;
      --paper: #111620;
      --sidebar-bg: #0e121a;
      --ink: #f1f5f9;
      --muted: #8b9bb4;
      --line: #1e293b;
      --accent: #818cf8;
      --accent-hover: #a5b4fc;
      --accent-soft: rgba(99, 102, 241, 0.14);
      --code: #090c10;
      --code-header: #131924;
      --green: #34d399;
      --surface-soft: #18202c;
      --surface-hover: #1a2230;
      --article-ink: #cbd5e1;
      --strong-ink: #f8fafc;
      --subtle-ink: #94a3b8;
      --inline-code-bg: #1e293b;
      --quote-bg: rgba(99, 102, 241, 0.07);
      --quote-ink: #cbd5e1;
      --quote-line: #818cf8;
      --button-bg: #161d29;
      --search-bg: #131924;
      --paper-shadow: 0 14px 40px -10px rgba(0, 0, 0, 0.55);
      --success-soft: rgba(16, 185, 129, 0.1);
      --success-border: rgba(52, 211, 153, 0.3);
      --success-ink: #34d399;
      --success-active: rgba(16, 185, 129, 0.18);
      --glass: rgba(11, 14, 20, 0.8);
    }

    :root[data-theme="sepia"] {
      color-scheme: dark;
      --bg: #161310;
      --paper: #1e1a16;
      --sidebar-bg: #1a1613;
      --ink: #f3eae0;
      --muted: #9e8e7c;
      --line: #322a23;
      --accent: #e69d55;
      --accent-hover: #f2b272;
      --accent-soft: rgba(230, 157, 85, 0.14);
      --code: #120f0d;
      --code-header: #211c18;
      --green: #7eb88a;
      --surface-soft: #28221d;
      --surface-hover: #2b241e;
      --article-ink: #d6c8b8;
      --strong-ink: #faf2e8;
      --subtle-ink: #b8a896;
      --inline-code-bg: #2c251f;
      --quote-bg: rgba(230, 157, 85, 0.07);
      --quote-ink: #decbb6;
      --quote-line: #d48842;
      --button-bg: #25201b;
      --search-bg: #181411;
      --paper-shadow: 0 14px 36px -8px rgba(0, 0, 0, 0.48);
      --success-soft: rgba(126, 184, 138, 0.12);
      --success-border: rgba(126, 184, 138, 0.3);
      --success-ink: #8ec99a;
      --success-active: rgba(126, 184, 138, 0.2);
      --glass: rgba(22, 19, 16, 0.82);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      background: var(--bg);
      scrollbar-width: thin;
      scrollbar-color: color-mix(in srgb, var(--muted) 28%, transparent) transparent;
    }
    html::-webkit-scrollbar { width: 8px; }
    html::-webkit-scrollbar-track { background: transparent; }
    html::-webkit-scrollbar-thumb {
      border: 2px solid transparent;
      border-radius: 99px;
      background: color-mix(in srgb, var(--muted) 28%, transparent);
      background-clip: padding-box;
    }
    html::-webkit-scrollbar-thumb:hover {
      background: color-mix(in srgb, var(--muted) 50%, transparent);
      background-clip: padding-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      transition: background-color .22s ease, color .22s ease;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    /* Layout */
    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      transition: grid-template-columns .24s cubic-bezier(.4, 0, .2, 1);
    }
    .app.sidebar-collapsed {
      grid-template-columns: 76px minmax(0, 1fr);
    }

    /* Sidebar */
    .sidebar {
      position: sticky;
      top: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      padding: 22px 16px 24px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--line);
      transition: background-color .22s ease, border-color .22s ease;
      scrollbar-width: none;
    }
    #navigation {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .sidebar::-webkit-scrollbar,
    #navigation::-webkit-scrollbar,
    .table-scroll::-webkit-scrollbar,
    pre::-webkit-scrollbar { display: none; }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 2px 4px 2px 6px;
    }
    .brand-mark {
      display: grid;
      place-items: center;
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 72%, #ec4899));
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -.04em;
      box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 32%, transparent);
    }
    .brand-copy { min-width: 0; flex: 1; }
    .brand-title {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -.02em;
      color: var(--ink);
    }
    .brand-subtitle {
      margin-top: 2px;
      color: var(--muted);
      font-size: 11.5px;
    }
    .brand-toggle {
      display: grid;
      flex: 0 0 30px;
      place-items: center;
      width: 30px;
      height: 30px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--button-bg);
      color: var(--muted);
      cursor: pointer;
      font-size: 15px;
      transition: all .15s ease;
      padding-bottom: 5px;
      margin: 5px 0;
    }
    .brand-toggle:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }

    /* Progress Card */
    .progress {
      margin: 20px 4px 16px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--paper);
    }
    .progress-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 11.5px;
      font-weight: 500;
    }
    .progress-row strong {
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .progress-track {
      height: 6px;
      margin-top: 9px;
      overflow: hidden;
      border-radius: 99px;
      background: var(--surface-soft);
    }
    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--accent), var(--green));
      transition: width .3s cubic-bezier(.4, 0, .2, 1);
    }

    /* Search */
    .search-wrap {
      display: block;
      position: relative;
      margin: 0 4px 20px;
    }
    .search-wrap span {
      position: absolute;
      top: 50%;
      left: 12px;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 14px;
      pointer-events: none;
    }
    .search {
      width: 100%;
      height: 38px;
      padding: 0 12px 0 34px;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      background: var(--search-bg);
      color: var(--ink);
      font-size: 13px;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .search::placeholder { color: var(--muted); }
    .search:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    /* Navigation */
    .chapter-group { margin: 0 0 20px; }
    .group-title {
      padding: 0 10px 8px;
      color: var(--muted);
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .chapter-list { display: grid; gap: 3px; }
    .chapter-link {
      width: 100%;
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 8px 10px;
      border: 1px solid transparent;
      border-radius: 9px;
      background: transparent;
      text-align: left;
      color: var(--subtle-ink);
      cursor: pointer;
      font-size: 13px;
      line-height: 1.42;
      transition: all .14s ease;
    }
    .chapter-link:hover {
      background: var(--surface-hover);
      color: var(--ink);
    }
    .chapter-link.active {
      background: var(--accent-soft);
      border-color: color-mix(in srgb, var(--accent) 22%, transparent);
      color: var(--accent);
      font-weight: 600;
    }
    .chapter-number {
      min-width: 24px;
      color: var(--muted);
      font-size: 11.5px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .chapter-link.active .chapter-number { color: var(--accent); }
    .chapter-link.done .chapter-number::after {
      content: "✓";
      margin-left: 4px;
      color: var(--green);
      font-size: 10.5px;
      font-weight: 700;
    }
    .empty-search {
      display: none;
      padding: 12px;
      text-align: center;
      color: var(--muted);
      font-size: 12.5px;
    }

    /* Theme Settings */
    .sidebar-settings {
      flex-shrink: 0;
      margin: auto 4px 0;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }
    .settings-title {
      margin: 0 6px 10px;
      color: var(--muted);
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .theme-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .theme-option {
      min-height: 34px;
      padding: 6px 4px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--button-bg);
      color: var(--subtle-ink);
      cursor: pointer;
      font-size: 11.5px;
      font-weight: 500;
      transition: all .15s ease;
    }
    .theme-option:hover {
      border-color: var(--accent);
      color: var(--ink);
    }
    .theme-option[aria-checked="true"] {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 650;
    }
    .theme-option .theme-icon { margin-right: 4px; }

    /* Collapsed Sidebar */
    .app.sidebar-collapsed .sidebar { padding-right: 10px; padding-left: 10px; }
    .app.sidebar-collapsed .brand { justify-content: center; gap: 0; padding: 0; flex-wrap: wrap; }
    .app.sidebar-collapsed .brand-copy,
    .app.sidebar-collapsed .progress,
    .app.sidebar-collapsed .search-wrap,
    .app.sidebar-collapsed .group-title,
    .app.sidebar-collapsed .chapter-link > span:last-child,
    .app.sidebar-collapsed .empty-search { display: none; }
    .app.sidebar-collapsed .brand-toggle { flex-basis: 100%; order: 2; margin-top: 10px; }
    .app.sidebar-collapsed .chapter-link { justify-content: center; padding: 9px 2px; }
    .app.sidebar-collapsed .chapter-number { min-width: 0; }
    .app.sidebar-collapsed .chapter-link.done .chapter-number::after { margin-left: 2px; }
    .app.sidebar-collapsed .sidebar-settings { display: none; }

    /* Main Content & Sticky Topbar */
    main {
      min-width: 0;
      padding: 0 clamp(18px, 4.5vw, 64px) 60px;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 820px;
      margin: 0 auto 24px;
      padding: 16px 4px;
      background: var(--glass);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid color-mix(in srgb, var(--line) 65%, transparent);
    }
    .crumb {
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 500;
    }
    .menu-button {
      display: none;
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--paper);
      cursor: pointer;
    }

    /* Article Card */
    .page {
      max-width: 820px;
      margin: 0 auto;
      padding: clamp(28px, 5vw, 56px) clamp(24px, 5.5vw, 64px);
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--paper);
      box-shadow: var(--paper-shadow);
      transition: background-color .22s ease, border-color .22s ease;
    }
    .chapter-kicker {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 99px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    h1 {
      margin: 14px 0 30px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line);
      font-size: clamp(28px, 4.5vw, 38px);
      font-weight: 800;
      line-height: 1.18;
      letter-spacing: -.035em;
      color: var(--ink);
    }

    /* Typography & Article Elements */
    .article {
      color: var(--article-ink);
      font-size: 15.5px;
      line-height: 1.78;
      overflow-wrap: anywhere;
    }
    .article h2 {
      margin: 40px 0 14px;
      padding-top: 12px;
      color: var(--ink);
      font-size: 21px;
      font-weight: 750;
      line-height: 1.35;
      letter-spacing: -.025em;
    }
    .article h3 {
      margin: 28px 0 10px;
      color: var(--ink);
      font-size: 17px;
      font-weight: 700;
      line-height: 1.4;
      letter-spacing: -.015em;
    }
    .article p { margin: 14px 0; }
    .article ul, .article ol {
      padding-left: 24px;
      margin: 12px 0 20px;
    }
    .article li {
      padding-left: 4px;
      margin: 6px 0;
    }
    .article li::marker {
      color: var(--accent);
      font-weight: 600;
    }
    .article strong {
      color: var(--strong-ink);
      font-weight: 650;
    }
    .article a {
      color: var(--accent);
      font-weight: 500;
      text-decoration: underline;
      text-decoration-color: color-mix(in srgb, var(--accent) 35%, transparent);
      text-underline-offset: 3px;
    }
    .article a:hover { text-decoration-color: var(--accent); }

    .article code:not(pre code) {
      padding: 2px 6px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--inline-code-bg);
      color: var(--accent);
      font: 500 .88em "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    /* Code Blocks */
    .code-wrap {
      position: relative;
      margin: 20px 0 24px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #1e293b;
      box-shadow: 0 8px 24px -6px rgba(15, 23, 42, 0.25);
    }
    .code-toolbar {
      position: absolute;
      z-index: 1;
      inset: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 36px;
      padding: 5px 10px 5px 14px;
      background: var(--code-header);
    }
    pre {
      overflow-x: auto;
      margin: 0;
      padding: 48px 22px 22px;
      background: var(--code);
      color: #e2e8f0;
      font: 13.5px/1.68 "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
      tab-size: 4;
      scrollbar-width: none;
    }
    .code-label {
      color: #94a3b8;
      font: 600 10px ui-sans-serif, system-ui, sans-serif;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .copy-code-button {
      padding: 4px 9px;
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.06);
      color: #cbd5e1;
      cursor: pointer;
      font: 500 11px ui-sans-serif, system-ui, sans-serif;
      transition: background-color .15s ease, border-color .15s ease, color .15s ease;
    }
    .copy-code-button:hover {
      border-color: rgba(148, 163, 184, 0.5);
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }
    .copy-code-button:focus-visible {
      outline: 2px solid #8bafff;
      outline-offset: 2px;
    }
    .syntax-comment { color: #6a9955; }
    .syntax-string { color: #ce9178; }
    .syntax-keyword { color: #c586c0; }
    .syntax-type { color: #4ec9b0; }
    .syntax-method { color: #dcdcaa; }
    .syntax-number { color: #b5cea8; }
    .syntax-operator { color: #d4d4d4; }

    /* Callouts / Blockquotes */
    .article blockquote {
      margin: 22px 0;
      padding: 14px 18px;
      border-left: 3.5px solid var(--quote-line);
      border-radius: 0 12px 12px 0;
      background: var(--quote-bg);
      color: var(--quote-ink);
    }
    .article blockquote p { margin: 0; }
    .article blockquote p + p { margin-top: 8px; }

    /* Tables */
    .table-scroll {
      overflow-x: auto;
      margin: 20px 0 24px;
      border: 1px solid var(--line);
      border-radius: 12px;
      scrollbar-width: none;
    }
    .article table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
      line-height: 1.55;
    }
    .article th, .article td {
      min-width: 100px;
      padding: 11px 15px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }
    .article th {
      background: var(--surface-soft);
      color: var(--ink);
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .article tr:hover td {
      background: color-mix(in srgb, var(--surface-soft) 45%, transparent);
    }
    .article tr:last-child td { border-bottom: 0; }

    .article hr {
      height: 1px;
      margin: 32px 0;
      border: 0;
      background: var(--line);
    }
    .article > :first-child { margin-top: 0; }

    /* Footer Actions */
    .page-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 44px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
    }
    .page-nav, .complete-button {
      min-height: 40px;
      padding: 9px 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--button-bg);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all .15s ease;
    }
    .page-nav:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }
    .page-nav:disabled {
      opacity: .38;
      cursor: default;
    }
    .complete-button {
      border-color: var(--success-border);
      background: var(--success-soft);
      color: var(--success-ink);
      font-weight: 650;
    }
    .complete-button:hover {
      background: var(--success-active);
      transform: translateY(-1px);
    }
    .complete-button.completed {
      border-color: var(--success-border);
      background: var(--success-active);
    }

    /* Error Screen */
    .error {
      max-width: 560px;
      margin: 10vh auto;
      padding: 36px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--paper);
      box-shadow: var(--paper-shadow);
    }
    .error h1 {
      margin-top: 0;
      padding-bottom: 0;
      border-bottom: 0;
      font-size: 24px;
    }
    .error p {
      color: var(--muted);
      line-height: 1.7;
    }
    .file-label {
      display: inline-flex;
      margin-top: 10px;
      padding: 10px 18px;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      cursor: pointer;
      font-size: 13.5px;
      font-weight: 600;
      transition: background-color .15s ease;
    }
    .file-label:hover { background: var(--accent-hover); }
    .file-label input { display: none; }

    .kralik-walker {
      position: fixed;
      z-index: 2;
      left: 0;
      bottom: 0;
      width: 80px;
      pointer-events: none;
    }
    .kralik { display: block; width: 100%; max-height: 160px; height: auto; object-fit: contain; }

    /* Responsive */
    @media (max-width: 820px) {
      .app { grid-template-columns: 1fr; }
      .app.sidebar-collapsed { grid-template-columns: 1fr; }
      .app.sidebar-collapsed .sidebar { padding: 22px 16px 24px; }
      .app.sidebar-collapsed .brand { justify-content: flex-start; gap: 12px; padding: 2px 4px 2px 6px; }
      .app.sidebar-collapsed .brand-copy,
      .app.sidebar-collapsed .progress,
      .app.sidebar-collapsed .search-wrap,
      .app.sidebar-collapsed .group-title,
      .app.sidebar-collapsed .chapter-link > span:last-child { display: revert; }
      .app.sidebar-collapsed .brand-toggle { flex: 0 0 30px; order: initial; margin-top: 0; }
      .app.sidebar-collapsed .chapter-link { justify-content: flex-start; padding: 8px 10px; }
      .app.sidebar-collapsed .chapter-number { min-width: 24px; }

      .sidebar {
        display: none;
        position: fixed;
        z-index: 10;
        top: 0;
        left: 0;
        width: min(320px, 88vw);
        box-shadow: 20px 0 50px rgba(0, 0, 0, 0.25);
      }
      .sidebar.open { display: flex; }
      main { padding: 0 14px 36px; }
      .topbar { margin: 0 auto 14px; padding: 12px 2px; }
      .menu-button { display: block; }
      .page { padding: 24px 20px; border-radius: 16px; }
      .page-actions { flex-wrap: wrap; }
      .complete-button { order: -1; width: 100%; }
    }

    @media (max-width: 420px) {
      .crumb { font-size: 11.5px; }
      .theme-option { font-size: 10.5px; }
      .theme-option .theme-icon { display: block; margin: 0 0 2px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Navigace v knize">
      <div class="brand">
        <div class="brand-mark">C#</div>
        <div class="brand-copy"><div class="brand-title">OAKM#</div><div class="brand-subtitle">Waiting 4 Halfar to approve</div></div>
        <button id="sidebar-toggle" class="brand-toggle" type="button" aria-label="Sbalit nabídku" title="Sbalit nabídku">«</button>
      </div>
      <div class="progress">
        <div class="progress-row"><span>Průběh studia</span><strong id="progress-label">0 / 37</strong></div>
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      </div>
      <label class="search-wrap"><span aria-hidden="true">⌕</span><input id="search" class="search" type="search" placeholder="Hledat téma..." autocomplete="off"></label>
      <nav id="navigation"></nav>
      <div id="empty-search" class="empty-search">Žádná témata nenalezena</div>
      <section class="sidebar-settings" aria-label="Nastavení vzhledu">
        <h2 class="settings-title">Vzhled</h2>
        <div class="theme-options" role="radiogroup" aria-label="Barevný motiv">
          <button class="theme-option" type="button" role="radio" data-theme-option="light" aria-checked="false" title="Světlý motiv"><span class="theme-icon" aria-hidden="true">☼</span>Bright</button>
          <button class="theme-option" type="button" role="radio" data-theme-option="sepia" aria-checked="true" title="Teplý motiv"><span class="theme-icon" aria-hidden="true">◐</span>Warm</button>
          <button class="theme-option" type="button" role="radio" data-theme-option="dark" aria-checked="false" title="Tmavý motiv"><span class="theme-icon" aria-hidden="true">☾</span>Dark</button>
        </div>
      </section>
    </aside>
    <main>
      <div class="topbar">
        <button id="menu-button" class="menu-button" type="button" aria-label="Otevřít obsah" aria-expanded="false">☰</button>
        <div class="crumb" id="breadcrumb">Studijní kniha <span aria-hidden="true">/</span> C#</div>
        <div class="crumb" id="chapter-count">37 témat</div>
      </div>
      <div id="book"></div>
    </main>
  </div>
  <div class="kralik-walker" aria-hidden="true"><img class="kralik" src="kralik.gif" alt=""></div>
  <script>
    (() => {
      const sourceName = "mistrove%20zapisy.md";
      const nav = document.getElementById("navigation");
      const book = document.getElementById("book");
      const search = document.getElementById("search");
      const sidebar = document.getElementById("sidebar");
      const app = document.getElementById("app");
      const sidebarToggle = document.getElementById("sidebar-toggle");
      const kralikWalker = document.querySelector(".kralik-walker");
      const kralik = kralikWalker.querySelector(".kralik");
      const themeOptions = [...document.querySelectorAll("[data-theme-option]")];
      const doneKey = "csharp-book-completed-v1";
      const themeKey = "csharp-book-theme-v1";
      const collapsedKey = "csharp-book-sidebar-collapsed-v1";
      let chapters = [];
      let activeIndex = 0;
      let completed = new Set();

      if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        let position = 0;
        let direction = 1;
        let previousTime = 0;

        function walkKralik(time) {
          if (previousTime) {
            const elapsed = Math.min((time - previousTime) / 1000, 0.05);
            const edgeGap = 12;
            const corridorStart = window.innerWidth <= 820
              ? edgeGap
              : Math.min(
                Math.round(window.innerWidth * 0.7),
                window.innerWidth - kralikWalker.offsetWidth - edgeGap
              );
            const maxPosition = Math.max(0, window.innerWidth - edgeGap - corridorStart - kralikWalker.offsetWidth);
            kralikWalker.style.left = `${corridorStart}px`;
            if (maxPosition === 0) {
              position = 0;
            } else {
              position += direction * 70 * elapsed;

              while (position > maxPosition || position < 0) {
                if (position > maxPosition) {
                  position = maxPosition - (position - maxPosition);
                  direction = -1;
                } else {
                  position = -position;
                  direction = 1;
                }
              }
            }

            kralikWalker.style.transform = `translateX(${position}px)`;
            kralik.style.transform = `scaleX(${direction})`;
          }
          previousTime = time;
          requestAnimationFrame(walkKralik);
        }

        requestAnimationFrame(walkKralik);
      }

      try { completed = new Set(JSON.parse(localStorage.getItem(doneKey) || "[]")); } catch {}

      function setTheme(theme, save = true) {
        const selected = ["light", "sepia", "dark"].includes(theme) ? theme : "light";
        document.documentElement.dataset.theme = selected;
        themeOptions.forEach((option) => {
          option.setAttribute("aria-checked", String(option.dataset.themeOption === selected));
        });
        document.querySelector('meta[name="theme-color"]').content =
          selected === "dark" ? "#0b0e14" : selected === "sepia" ? "#161310" : "#f4f6f9";
        if (save) localStorage.setItem(themeKey, selected);
      }

      function setSidebarCollapsed(collapsed, save = true) {
        app.classList.toggle("sidebar-collapsed", collapsed);
        const label = collapsed ? "Rozbalit nabídku" : "Sbalit nabídku";
        sidebarToggle.textContent = collapsed ? "»" : "«";
        sidebarToggle.setAttribute("aria-label", label);
        sidebarToggle.title = label;
        if (save) localStorage.setItem(collapsedKey, String(collapsed));
      }

      try {
        setTheme(localStorage.getItem(themeKey) || "sepia", false);
        setSidebarCollapsed(localStorage.getItem(collapsedKey) === "true", false);
      } catch {
        setTheme("sepia", false);
        setSidebarCollapsed(false, false);
      }

      themeOptions.forEach((option) => {
        option.addEventListener("click", () => setTheme(option.dataset.themeOption));
      });

      sidebarToggle.addEventListener("click", () => {
        if (window.matchMedia("(max-width: 820px)").matches) {
          sidebar.classList.remove("open");
          document.getElementById("menu-button").setAttribute("aria-expanded", "false");
          return;
        }
        setSidebarCollapsed(!app.classList.contains("sidebar-collapsed"));
      });

      const escapeHtml = (text) => text.replace(/[&<>"']/g, (char) => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
      })[char]);

      function highlightCode(code) {
        const tokenPattern = /(\/\*[\s\S]*?\*\/|\/\/[^\n]*|\$@"(?:""|[^"])*"|@\$"(?:""|[^"])*"|@"(?:""|[^"])*"|\$"(?:\\.|[^"\\])*"|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(\b(?:abstract|as|async|await|base|bool|break|byte|case|catch|char|checked|class|const|continue|decimal|default|delegate|do|double|else|enum|event|explicit|extern|false|finally|fixed|float|for|foreach|goto|if|implicit|in|int|interface|internal|is|lock|long|namespace|new|null|object|operator|out|override|params|private|protected|public|readonly|ref|return|sbyte|sealed|short|sizeof|stackalloc|static|string|struct|switch|this|throw|true|try|typeof|uint|ulong|unchecked|unsafe|ushort|using|var|virtual|void|volatile|while)\b)|(\b(?:Console|String|Math|DateTime|TimeSpan|Random|List|Array|Exception|File|Path|Task|IDisposable|IEnumerable|Convert)\b)|(\b\d+(?:\.\d+)?(?:[fFdDmMuUlL]{1,2})?\b)|(\b[A-Za-z_]\w*(?=\s*\())|([=+\-*\/%!?<>|&^~]+)/g;
        return code.replace(tokenPattern, (token, literal, keyword, type, number, method, operatorToken) => {
          let className = "";
          if (literal) className = /^(?:\/\/|\/\*)/.test(literal) ? "syntax-comment" : "syntax-string";
          else if (keyword) className = "syntax-keyword";
          else if (type) className = "syntax-type";
          else if (number) className = "syntax-number";
          else if (method) className = "syntax-method";
          else if (operatorToken) className = "syntax-operator";
          return className ? `<span class="${className}">${escapeHtml(token)}</span>` : escapeHtml(token);
        });
      }

      function inline(text) {
        let out = escapeHtml(text);
        out = out.replace(/\\\|/g, "|");
        out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
        out = out.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
        out = out.replace(/\*([^*]+)\*/g, "<em>$1</em>");
        out = out.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, href) => {
          const safeHref = href.startsWith("#") || /^https?:\/\//i.test(href) ? href : "#";
          return `<a href="${safeHref}">${label}</a>`;
        });
        return out;
      }

      function renderMarkdown(markdown) {
        const lines = markdown.split(/\r?\n/);
        let html = "";
        let i = 0;
        const isTableRow = (line) => /^\s*\|.*\|\s*$/.test(line);
        const isSeparator = (line) => /^\s*\|?[\s:|-]+\|?\s*$/.test(line) && line.includes("-");
        const splitTableRow = (line) => {
          const trimmed = line.trim();
          const content = trimmed.replace(/^\|/, "").replace(/\|$/, "");
          const cells = [];
          let cell = "";
          for (let index = 0; index < content.length; index++) {
            if (content[index] === "\\" && content[index + 1] === "|") {
              cell += "\\|";
              index++;
            } else if (content[index] === "|") {
              cells.push(cell.trim());
              cell = "";
            } else {
              cell += content[index];
            }
          }
          cells.push(cell.trim());
          return cells;
        };
        while (i < lines.length) {
          const line = lines[i];
          if (!line.trim()) { i++; continue; }
          if (/^```/.test(line)) {
            const language = line.slice(3).trim();
            i++;
            const code = [];
            while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]);
            if (i < lines.length) i++;
            const codeText = code.join("\n");
            const isCSharp = /^(?:csharp|cs|c#)$/i.test(language);
            html += `<div class="code-wrap"><div class="code-toolbar">${language ? `<span class="code-label">${escapeHtml(language)}</span>` : "<span></span>"}<button class="copy-code-button" type="button" aria-label="Zkopírovat kód" title="Zkopírovat kód">Kopírovat</button></div><pre><code>${isCSharp ? highlightCode(codeText) : escapeHtml(codeText)}</code></pre></div>`;
            continue;
          }
          if (/^#{2,3} /.test(line)) {
            const level = line.match(/^#+/)[0].length;
            html += `<h${level}>${inline(line.replace(/^#{2,3} /, ""))}</h${level}>`;
            i++; continue;
          }
          if (isTableRow(line) && i + 1 < lines.length && isSeparator(lines[i + 1])) {
            const rows = [];
            while (i < lines.length && isTableRow(lines[i])) {
              if (!isSeparator(lines[i])) rows.push(splitTableRow(lines[i]));
              i++;
            }
            if (rows.length) {
              html += '<div class="table-scroll"><table><thead><tr>' + rows[0].map((cell) => `<th>${inline(cell)}</th>`).join("") + "</tr></thead><tbody>";
              rows.slice(1).forEach((row) => {
                html += "<tr>" + rows[0].map((_, cellIndex) => `<td>${inline(row[cellIndex] || "")}</td>`).join("") + "</tr>";
              });
              html += "</tbody></table></div>";
            }
            continue;
          }
          if (/^\s*>\s?/.test(line)) {
            const quote = [];
            while (i < lines.length && /^\s*>\s?/.test(lines[i])) quote.push(lines[i++].replace(/^\s*>\s?/, ""));
            html += `<blockquote>${quote.map((text) => `<p>${inline(text)}</p>`).join("")}</blockquote>`;
            continue;
          }
          if (/^\s*([-*])\s+/.test(line) || /^\s*\d+\.\s+/.test(line)) {
            const ordered = /^\s*\d+\.\s+/.test(line);
            const tag = ordered ? "ol" : "ul";
            const items = [];
            while (i < lines.length && (ordered ? /^\s*\d+\.\s+/ : /^\s*[-*]\s+/).test(lines[i])) {
              items.push(`<li>${inline(lines[i++].replace(ordered ? /^\s*\d+\.\s+/ : /^\s*[-*]\s+/, ""))}</li>`);
            }
            html += `<${tag}>${items.join("")}</${tag}>`;
            continue;
          }
          if (/^\s*([-*_])\s*\1\s*\1[\s*_]*$/.test(line)) { html += "<hr>"; i++; continue; }
          if (/^</.test(line.trim())) { i++; continue; }
          const paragraph = [line.trim()];
          i++;
          while (i < lines.length && lines[i].trim() && !/^(#{2,3} |```|\s*>|\s*[-*]\s+|\s*\d+\.\s+)/.test(lines[i]) && !(isTableRow(lines[i]) && i + 1 < lines.length && isSeparator(lines[i + 1]))) {
            paragraph.push(lines[i++].trim());
          }
          html += `<p>${inline(paragraph.join(" "))}</p>`;
        }
        return html;
      }

      function parseBook(markdown) {
        const lines = markdown.split(/\r?\n/);
        const groupNames = {};
        const result = [];
        for (let i = 0; i < lines.length; i++) {
          const category = lines[i].match(/^###\s+([1-3])\.\s+(.+)$/);
          if (category) { groupNames[category[1]] = category[2]; continue; }
          const heading = lines[i].match(/^#\s+(\d+)\.\s+(.+)$/);
          if (!heading) continue;
          const number = Number(heading[1]);
          const groupNumber = number <= 17 ? 1 : number <= 33 ? 2 : 3;
          const start = i + 1;
          let end = start;
          while (end < lines.length && !/^#\s+\d+\.\s+/.test(lines[end])) end++;
          result.push({
            number,
            title: heading[2],
            group: groupNames[groupNumber] || "C#",
            markdown: lines.slice(start, end).join("\n").trim().replace(/(?:\r?\n\s*---\s*)+$/, "").trim()
          });
          i = end - 1;
        }
        return result;
      }

      function updateProgress() {
        document.getElementById("progress-label").textContent = `${completed.size} / ${chapters.length}`;
        document.getElementById("progress-fill").style.width = `${chapters.length ? completed.size / chapters.length * 100 : 0}%`;
      }

      function formatTopicCount(count) {
        const noun = count === 1 ? "téma" : count >= 2 && count <= 4 ? "témata" : "témat";
        return `${count} ${noun}`;
      }

      function renderNavigation() {
        const query = search.value.trim().toLocaleLowerCase();
        const visible = chapters.filter((chapter) => `${chapter.title} ${chapter.group}`.toLocaleLowerCase().includes(query));
        nav.innerHTML = "";
        const groups = [...new Set(visible.map((chapter) => chapter.group))];
        groups.forEach((group) => {
          const section = document.createElement("section");
          section.className = "chapter-group";
          section.innerHTML = `<div class="group-title">${escapeHtml(group)}</div><div class="chapter-list"></div>`;
          const list = section.querySelector(".chapter-list");
          visible.filter((chapter) => chapter.group === group).forEach((chapter) => {
            const index = chapters.indexOf(chapter);
            const button = document.createElement("button");
            button.type = "button";
            button.className = `chapter-link${index === activeIndex ? " active" : ""}${completed.has(chapter.number) ? " done" : ""}`;
            button.innerHTML = `<span class="chapter-number">${String(chapter.number).padStart(2, "0")}</span><span>${escapeHtml(chapter.title)}</span>`;
            button.addEventListener("click", () => selectChapter(index));
            list.appendChild(button);
          });
          nav.appendChild(section);
        });
        document.getElementById("empty-search").style.display = visible.length ? "none" : "block";
      }

      function renderChapter() {
        const chapter = chapters[activeIndex];
        if (!chapter) return;
        document.getElementById("breadcrumb").innerHTML = `${escapeHtml(chapter.group)} <span aria-hidden="true">/</span> Téma ${chapter.number}`;
        book.innerHTML = `
          <article class="page">
            <div class="chapter-kicker">Kapitola ${String(chapter.number).padStart(2, "0")} · ${escapeHtml(chapter.group)}</div>
            <h1>${escapeHtml(chapter.title)}</h1>
            <div class="article">${renderMarkdown(chapter.markdown)}</div>
            <div class="page-actions">
              <button class="page-nav" id="previous" type="button" ${activeIndex === 0 ? "disabled" : ""}>← Předchozí</button>
              <button class="complete-button${completed.has(chapter.number) ? " completed" : ""}" id="complete" type="button">${completed.has(chapter.number) ? "✓ Téma dokončena" : "Označit jako dokončenou"}</button>
              <button class="page-nav" id="next" type="button" ${activeIndex === chapters.length - 1 ? "disabled" : ""}>Další →</button>
            </div>
          </article>`;
        document.getElementById("previous").addEventListener("click", () => selectChapter(activeIndex - 1));
        document.getElementById("next").addEventListener("click", () => selectChapter(activeIndex + 1));
        document.getElementById("complete").addEventListener("click", () => {
          completed.has(chapter.number) ? completed.delete(chapter.number) : completed.add(chapter.number);
          localStorage.setItem(doneKey, JSON.stringify([...completed]));
          updateProgress(); renderNavigation(); renderChapter();
        });
      }

      book.addEventListener("click", async (event) => {
        const button = event.target.closest(".copy-code-button");
        if (!button) return;
        const code = button.closest(".code-wrap").querySelector("pre code").textContent;
        try {
          if (navigator.clipboard?.writeText) {
            await navigator.clipboard.writeText(code);
          } else {
            const textarea = document.createElement("textarea");
            textarea.value = code;
            textarea.setAttribute("readonly", "");
            textarea.style.position = "fixed";
            textarea.style.opacity = "0";
            document.body.appendChild(textarea);
            textarea.select();
            const copied = document.execCommand("copy");
            textarea.remove();
            if (!copied) throw new Error("Prohlížeč nepodporuje kopírování");
          }
          button.textContent = "Zkopírováno";
          button.title = "Kód byl zkopírován";
        } catch (error) {
          console.error("Kód se nepodařilo zkopírovat:", error);
          button.textContent = "Chyba";
          button.title = "Kód se nepodařilo zkopírovat";
        }
        window.setTimeout(() => {
          if (button.isConnected) {
            button.textContent = "Kopírovat";
            button.title = "Zkopírovat kód";
          }
        }, 1800);
      });

      function selectChapter(index) {
        if (index < 0 || index >= chapters.length) return;
        activeIndex = index;
        renderNavigation();
        renderChapter();
        sidebar.classList.remove("open");
        document.getElementById("menu-button").setAttribute("aria-expanded", "false");
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function showError() {
        book.innerHTML = `<section class="error"><h1>Nepodařilo se otevřít studijní materiál</h1><p>Spusťte stránku přes místní server, například pomocí rozšíření Live Server ve VS Code, nebo ručně vyberte soubor <strong>mistrove zapisy.md</strong>.</p><label class="file-label">Vybrat soubor<input id="source-file" type="file" accept=".md,text/markdown"></label></section>`;
        document.getElementById("source-file").addEventListener("change", async (event) => {
          const file = event.target.files[0];
          if (file) startBook(await file.text());
        });
      }

      function startBook(markdown) {
        chapters = parseBook(markdown);
        if (!chapters.length) { showError(); return; }
        document.getElementById("chapter-count").textContent = formatTopicCount(chapters.length);
        updateProgress();
        renderNavigation();
        renderChapter();
      }

      search.addEventListener("input", renderNavigation);
      document.getElementById("menu-button").addEventListener("click", () => {
        const isOpen = sidebar.classList.toggle("open");
        document.getElementById("menu-button").setAttribute("aria-expanded", String(isOpen));
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && sidebar.classList.contains("open")) {
          sidebar.classList.remove("open");
          document.getElementById("menu-button").setAttribute("aria-expanded", "false");
        }
      });
      fetch(sourceName).then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.text();
      }).then(startBook).catch(showError);
    })();
  </script>
</body>
</html>
